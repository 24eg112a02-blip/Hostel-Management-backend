# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=smart-hostel-management

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smarthostel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Security Configuration
jwt.secret=9a4f2c8d3b7a1e6f4c8b2d0e1a3f5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e7f92
jwt.expiration=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
